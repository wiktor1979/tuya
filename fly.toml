# fly.toml app configuration file generated for scop on 2026-08-13T19:37:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scop'
primary_region = 'arn'

[build]

[[mounts]]
  source = 'tuya_data'
  destination = '/data'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
